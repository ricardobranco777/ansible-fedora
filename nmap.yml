---
- name: Install latest Nmap and Ncat from upstream on any RPM-based distro
  hosts: all
  user: root
  vars:
    rpm_base_url: "https://nmap.org/dist"
    rpm_packages:
      - ncat
      - nmap
      - nping

  tasks:
    - name: Get latest RPM filenames
      shell: curl -s {{ rpm_base_url }}/ | grep -oP '{{ item }}-[\d\.-]+\.x86_64\.rpm' | sort -V | tail -1
      loop: "{{ rpm_packages }}"
      register: rpm_filenames
      changed_when: false

    - name: Set RPM URLs
      set_fact:
        rpm_urls: "{{ rpm_filenames.results | map(attribute='stdout') | map('regex_replace', '^', rpm_base_url + '/') }}"

    - name: Import Nmap GPG keys
      ansible.builtin.shell: curl -fsS https://svn.nmap.org/nmap/docs/nmap_gpgkeys.txt | gpg --import
      changed_when: false

    - name: Verify RPM signatures
      ansible.builtin.shell: |
        set -o pipefail
        curl -fsS {{ item }} | gpg --status-fd 1 --verify <(curl -fsS {{ item | replace('/dist/', '/dist/sigs/') }}.asc) - 2>/dev/null |
          grep -q 'VALIDSIG .* 436D66AB9A798425FDA0E3F801AF9F036B9355D0$'
      args:
        executable: /bin/bash
      loop: "{{ rpm_urls }}"
      changed_when: false

    # Upstream RPMs have no rpm digest/signature (verified with GPG above).
    # --oldpackage: upstream uses epoch 1, Fedora's nmap uses epoch 4.
    - name: Install RPMs directly from URL
      ansible.builtin.command: rpm -Uvh --nodigest --nosignature --oldpackage --replacepkgs {{ rpm_urls | join(' ') }}
      register: rpm_install
      changed_when: "'Updating / installing' in rpm_install.stdout"

    - name: Show installed versions
      command: "{{ item }} --version"
      register: version_output
      loop: "{{ rpm_packages }}"
      changed_when: false
      ignore_errors: true

    - name: Display installed versions
      debug:
        msg: "{{ item.stdout }}"
      loop: "{{ version_output.results }}"
